<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14151c">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RE:ARISE Demo">
<title>RE:ARISE — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14151c;--bg2:#191b24;--surface:#1f2230;--surface2:#272b3b;--line:#2f3344;--line2:#3a3f54;
    --text:#f1f3f8;--muted:#a2a8bf;--dim:#6b7186;--accent:#8b7bff;--accent2:#6aa6ff;--xp:#ffd166;--ok:#5ad1a6;
    --grad:linear-gradient(135deg,#8b7bff,#6aa6ff);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;min-height:100vh;background:radial-gradient(700px 420px at 50% -6%,#20233a 0%,var(--bg) 60%)}
  #app{width:100%;max-width:460px;min-height:100vh;position:relative;display:flex;flex-direction:column}
  .screen{flex:1;padding:22px 18px 100px;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.2px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:none;color:var(--muted)}
  .logo{font-weight:900;font-size:23px;letter-spacing:1.5px}.logo b{color:var(--accent)}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.center{text-align:center}
  .small{font-size:13px}.tiny{font-size:11px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:12px;
    padding:15px;font-size:15px;font-weight:700;letter-spacing:.2px;text-transform:none;color:#fff;
    background:var(--grad);cursor:pointer;box-shadow:0 6px 18px rgba(139,123,255,.22);transition:transform .12s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface2);box-shadow:none;border:1px solid var(--line2);color:var(--text)}
  .btn.ok{background:linear-gradient(135deg,#23c98a,#19b3a6);box-shadow:0 6px 20px rgba(35,201,138,.25);color:#04221a}
  .btn.gold{background:linear-gradient(135deg,#ffb02e,#ff7a1a);box-shadow:0 6px 20px rgba(255,176,46,.3);color:#2a1800}
  .btn.sm{padding:12px;font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line2);
    border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.5px}
  .tag{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:none;padding:3px 9px;border-radius:6px;
    background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
  .rankbadge{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:13px;
    font-weight:900;font-size:24px;color:#06070b;font-family:Georgia,serif}
  .progress{height:8px;background:#0a0b10;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progress>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s ease}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
  .stat .lab{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-weight:800;text-transform:none;letter-spacing:1px}
  .stat .rk{font-size:26px;font-weight:900;font-family:Georgia,serif;line-height:1.1}
  .ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;position:relative}
  .ex.done{border-color:rgba(35,201,138,.5);background:linear-gradient(180deg,rgba(35,201,138,.06),var(--surface))}
  .ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--line2);color:var(--accent2);flex:0 0 auto}
  .nav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;display:flex;background:rgba(20,21,28,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .nav button{flex:1;background:none;border:none;color:var(--dim);padding:13px 0 18px;font-size:10px;font-weight:800;letter-spacing:1px;
    text-transform:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .nav button.act{color:var(--accent)}
  .modal{position:fixed;inset:0;max-width:460px;margin:0 auto;background:rgba(4,5,8,.86);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50;animation:fade .22s}
  .modalbox{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:26px 22px;width:100%;text-align:center;animation:up .25s ease}
  @keyframes up{from{transform:translateY(50px);opacity:.5}to{transform:none;opacity:1}}
  .timer{font-size:58px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--ok)}
  .num{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--xp);color:var(--xp);font-weight:800;padding:10px 18px;border-radius:10px;z-index:260;animation:pop .3s;font-size:13px;letter-spacing:.5px}
  @keyframes pop{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .setdots{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .setbtn{flex:1;min-width:60px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:13px 6px;
    text-align:center;font-weight:800;cursor:pointer;font-size:13px;letter-spacing:.5px;color:var(--muted);transition:.15s;
    text-transform:none;display:flex;align-items:center;justify-content:center}
  .setbtn.ok{background:linear-gradient(135deg,#23c98a,#19b3a6);color:#04221a;border-color:transparent}
  .floaty{position:absolute;font-weight:900;color:var(--xp);pointer-events:none;animation:floaty 1s ease forwards;font-size:15px}
  @keyframes floaty{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
  .bigico{display:flex;justify-content:center;color:var(--accent);margin:8px 0}
  .divider{height:1px;background:var(--line);margin:4px 0}
  .onom{position:absolute;font-family:"Bangers",sans-serif;color:#fff;-webkit-text-stroke:1.6px #111;font-size:30px;letter-spacing:1px;pointer-events:none;animation:onom .85s ease forwards;z-index:8;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
  @keyframes onom{0%{opacity:0;transform:scale(.4) rotate(-9deg)}28%{opacity:1;transform:scale(1.18) rotate(-9deg)}100%{opacity:0;transform:scale(1) rotate(-9deg) translateY(-22px)}}
  .display{font-family:"Bangers",system-ui,sans-serif;font-weight:400;letter-spacing:1px}
  .halftone{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.5px);background-size:9px 9px;pointer-events:none;opacity:.5}
  .pips{display:flex;gap:6px;flex:0 0 auto}
  .pip{width:9px;height:9px;border-radius:50%;background:var(--line2)}
  .pip.on{background:var(--accent)}
  .setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:13px}
  .setbtns{display:flex;gap:8px;flex:1 1 100%;align-items:stretch;min-width:0}
  .setbtns>button{flex:1 1 0;min-width:0;margin:0;padding:10px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;justify-content:center}
  .setmini{flex:0 0 auto;min-width:0;padding:9px 11px}
  .narr{border:1px solid var(--line2);border-left:3px solid var(--accent2);background:var(--surface2);padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.55;text-align:left;font-style:italic;color:var(--muted)}
  .fx{position:fixed;inset:0;max-width:460px;margin:0 auto;z-index:70;pointer-events:none;overflow:hidden}
  .flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(139,123,255,.5),transparent 60%);animation:flash .7s ease-out forwards}
  .rays{position:absolute;pointer-events:none;top:45%;left:50%;width:780px;height:780px;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0deg 5deg,transparent 5deg 13deg);animation:spin 2.4s linear,rayfade 1.6s ease forwards}
  .rays.gold{background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.22) 0deg 5deg,transparent 5deg 13deg)}
  .fxtxt{position:absolute;top:45%;left:0;right:0;transform:translateY(-50%);text-align:center;animation:popbig .6s cubic-bezier(.2,1.5,.4,1)}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  @keyframes rayfade{0%{opacity:.9}70%{opacity:.5}100%{opacity:0}}
  @keyframes popbig{0%{transform:translateY(-50%) scale(.3);opacity:0}60%{transform:translateY(-50%) scale(1.15);opacity:1}100%{transform:translateY(-50%) scale(1)}}
  .syshdr{display:inline-block;background:var(--accent2);color:#fff;font-weight:800;font-size:11px;letter-spacing:3px;padding:4px 12px;border-radius:5px;margin-bottom:8px}
  .sysframe{position:relative;border:1px solid var(--accent2);border-radius:16px;background:linear-gradient(180deg,rgba(20,22,34,.55),rgba(10,11,18,.5));padding:22px 18px 20px;box-shadow:0 0 26px rgba(106,166,255,.16),inset 0 0 30px rgba(106,166,255,.05);margin-top:8px}
  .sysframe:before,.sysframe:after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--accent2)}
  .sysframe:before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-top-left-radius:14px}
  .sysframe:after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-bottom-right-radius:14px}
  .systag{font-family:ui-monospace,Menlo,monospace;color:var(--accent2);font-size:12px;letter-spacing:3px;font-weight:800;text-align:center;margin-bottom:12px}
  .syscur{display:inline-block;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sysnar{text-align:center;color:var(--muted);font-size:13px;font-style:italic;margin-top:6px;line-height:1.5}
  .syswin:before,.syswin:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent2);opacity:.85}
  .syswin:before{top:7px;left:7px;border-right:0;border-bottom:0}
  .syswin:after{bottom:7px;right:7px;border-left:0;border-top:0}
  .modalbox.syswin{position:relative}
  @keyframes awflash{0%{opacity:0}10%{opacity:1}30%{opacity:.85}100%{opacity:0}}
  .awflash{position:fixed;inset:0;z-index:320;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--accent2) 35%,transparent 70%);animation:awflash 1.1s ease forwards}
  @keyframes shake{10%{transform:translate(-2px,1px)}20%{transform:translate(3px,-2px)}30%{transform:translate(-4px,2px)}40%{transform:translate(4px,2px)}50%{transform:translate(-3px,-1px)}60%{transform:translate(3px,1px)}70%{transform:translate(-3px,2px)}80%{transform:translate(2px,-2px)}90%{transform:translate(-1px,1px)}100%{transform:translate(0,0)}}
  .shake{animation:shake .42s ease}
  .speedlines{position:fixed;inset:0;z-index:18;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 2.6deg,rgba(255,255,255,.16) 3.1deg,rgba(255,255,255,0) 3.6deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 30%,#000 62%);mask:radial-gradient(circle at 50% 50%,transparent 30%,#000 62%);animation:slpop .5s ease forwards}
  @keyframes slpop{0%{opacity:0;transform:scale(1.18)}30%{opacity:1}100%{opacity:0;transform:scale(1)}}
  .bosswrap{border:1px solid #ff5566;border-radius:14px;padding:12px;margin:0 0 14px;background:linear-gradient(180deg,rgba(255,85,102,.10),transparent);box-shadow:0 0 20px rgba(255,85,102,.12);position:relative}
  .bossface{font-size:34px;line-height:1}
  .hpbar{height:12px;border-radius:8px;background:rgba(255,90,110,.18);overflow:hidden;margin-top:9px}
  .hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ff5566,#ff8a3d);transition:width .35s ease}
  .hpnum{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:#ff8a8a;font-size:13px}
  .bosshit{animation:shake .35s ease}
  .dmgfloat{position:fixed;z-index:20;font-family:ui-monospace,Menlo,monospace;font-weight:800;color:#ff6b7a;font-size:24px;text-shadow:0 1px 0 #000;pointer-events:none;animation:dmgf .9s ease forwards}
  @keyframes dmgf{0%{opacity:0;transform:translateY(0) scale(.8)}25%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
  .bosszap{position:absolute;inset:-2px;border-radius:16px;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(139,123,255,.28) 42%,transparent 72%);animation:bzap .34s ease-out forwards}
  @keyframes bzap{0%{opacity:.9;transform:scale(.95)}100%{opacity:0;transform:scale(1.05)}}
  .combopop{position:fixed;z-index:22;font-weight:900;font-style:italic;color:#ffd166;text-shadow:0 2px 8px rgba(0,0,0,.6),0 0 14px rgba(255,209,102,.7);pointer-events:none;animation:combop .8s ease-out forwards}
  @keyframes combop{0%{opacity:0;transform:translateY(6px) scale(.7)}25%{opacity:1;transform:translateY(-2px) scale(1.15)}100%{opacity:0;transform:translateY(-28px) scale(1)}}
  .combotag{padding:2px 8px;border-radius:20px;background:linear-gradient(90deg,#8b7bff,#ff8a8a);color:#fff;font-weight:900;font-size:12px;margin-right:8px}
  @keyframes intrologo{0%{opacity:0;transform:scale(.55)}55%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  .tapwiggle{animation:tapb 1.4s ease-in-out infinite}
  @keyframes tapb{0%,100%{opacity:.35}50%{opacity:1}}
  svg{display:block}
  /* ---- gacha / cards ---- */
  .packbtn{width:190px;margin:14px auto 0;aspect-ratio:3/4;border-radius:18px;position:relative;cursor:pointer;overflow:hidden;
    background:radial-gradient(circle at 50% 34%,#33236a,#0a0a12 72%);border:3px solid var(--accent);
    box-shadow:0 0 40px rgba(139,123,255,.55);display:flex;align-items:center;justify-content:center;animation:packbob 2.2s ease-in-out infinite}
  .packbtn:active{transform:scale(.97)}
  .packbtn .pk{font-family:"Bangers",system-ui,sans-serif;font-size:132px;line-height:1;color:#fff;text-shadow:0 0 22px var(--accent),0 4px 0 rgba(0,0,0,.3)}
  .packbtn .pklabel{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-weight:900;letter-spacing:3px;font-size:12px;color:#cfd3e6}
  .packbtn .pkgem{position:absolute;top:14px;left:0;right:0;text-align:center;color:var(--accent);font-size:20px}
  .packbtn .pkstar{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 6deg,transparent 6deg 15deg)}
  .packbtn .pkshine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:cshine 2.6s linear infinite}
  @keyframes packbob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-8px) rotate(1.2deg)}}
  .gcard{width:100%;border-radius:14px;overflow:hidden;position:relative;background:#0e0f15;border:3px solid #555}
  .gcardart{position:relative;aspect-ratio:3/4;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:58px;background:radial-gradient(120% 90% at 50% 12%,rgba(139,123,255,.30),#12131c 70%)}
  .gcardgem{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:20px;border:1px solid #555;z-index:2}
  .gcardgem span{width:8px;height:8px;transform:rotate(45deg);display:inline-block}
  .gcardgem b{font-size:10px;letter-spacing:1px}
  .gcardname{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(8,8,14,.96));padding:20px 6px 6px;text-align:center;z-index:2}
  .gcardname .gn{font-weight:800;font-size:11px;line-height:1.05}
  .gstars{font-size:11px;letter-spacing:1px;margin-top:2px}
  .gcard .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.6;z-index:2}
  .cardholo{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(255,0,128,.18),rgba(0,200,255,.18),rgba(180,120,255,.18),rgba(255,220,60,.18),rgba(255,0,128,.18));mix-blend-mode:screen;pointer-events:none}
  .cardshine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);mix-blend-mode:screen;pointer-events:none;animation:cshine 3.2s linear infinite}
  @keyframes cshine{0%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
  .flipwrap{position:relative;width:210px;max-width:74%;margin:0 auto;perspective:1100px}
  .revrays{position:absolute;top:50%;left:50%;width:320px;height:320px;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;animation:revpulse 1.3s ease-in-out infinite}
  .flipcard{position:relative;width:100%;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,1.5,.55,1);cursor:pointer}
  .flipcard.flipped{transform:rotateY(180deg)}
  .flipface{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;overflow:hidden}
  .flipback{background:radial-gradient(circle at 50% 38%,#2a1e52,#0a0a12);border:3px solid #555;display:flex;align-items:center;justify-content:center;font-size:60px;color:#8b7bff}
  .flipfront{transform:rotateY(180deg)}
  .revtag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--xp);color:#0a0a12;font-weight:900;font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap;z-index:5}
  .revhint{color:var(--muted);font-size:12px;margin-top:12px;animation:revblink 1.4s ease-in-out infinite}
  @keyframes revpulse{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.55;transform:translate(-50%,-50%) scale(1.1)}}
  @keyframes revblink{0%,100%{opacity:.4}50%{opacity:1}}
  /* ---- demo-only chrome ---- */
  .demochip{position:fixed;top:10px;left:10px;z-index:150;background:var(--grad);color:#fff;font-weight:900;font-size:10px;letter-spacing:2px;padding:5px 11px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .democtl{position:fixed;top:8px;right:10px;z-index:150;display:flex;gap:8px}
  .democtl button{background:rgba(31,34,48,.85);border:1px solid var(--line2);color:var(--muted);border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  .democtl button:active{transform:scale(.94)}
  .plcard{margin-top:12px;border:1px solid var(--accent2);border-radius:14px;padding:12px;background:linear-gradient(180deg,rgba(106,166,255,.10),transparent);box-shadow:0 0 22px rgba(106,166,255,.14)}
  .plnum{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:1px;font-size:38px;color:var(--accent2);text-shadow:0 0 16px var(--accent)}
  .cardrev{width:190px;margin:14px auto 6px;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:76px;
    border:2px solid var(--accent2);background:linear-gradient(160deg,#2a2f45,#171a26);box-shadow:0 0 30px rgba(139,123,255,.35);animation:cardin .6s cubic-bezier(.2,1.4,.4,1)}
  .cardrev.holo{background:linear-gradient(160deg,#3a2b52,#2a1e3d,#173047);border-color:var(--xp);box-shadow:0 0 40px rgba(255,209,102,.4)}
  .cardrev .cgrade{position:absolute;top:8px;left:10px;font-family:Georgia,serif;font-weight:900;font-size:22px}
  .cardrev .cname{position:absolute;left:0;right:0;bottom:0;padding:8px 6px;font-size:11px;font-weight:800;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));letter-spacing:.5px}
  @keyframes cardin{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
  .heroimg-fake{width:100%;aspect-ratio:1/1;border-radius:18px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:120px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(139,123,255,.35),var(--surface) 65%);position:relative;overflow:hidden}
</style>
</head>
<body>

<div id="app"></div>
<script>
/* ============ RE:ARISE — convention demo (self-contained) ============ */

 var p={force:'<path d="M13 2 4 14h7l-1 8 10-13h-7l3-7z"/>',

  flame:'<path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1.5.8-2.6 1.6-3.4C9.7 9 10 10 11 10c.8 0 .8-1.6-.5-5C11.5 4 12 3.5 12 3z"/>',
  back:'<polyline points="15 18 9 12 15 6"/>',up:'<polyline points="18 15 12 9 6 15"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  star:'<path d="M12 2l2.6 6.6L22 9.2l-5 4.6L18.5 22 12 18.2 5.5 22 7 13.8l-5-4.6 7.4-.6z"/>',
  trophy:'<path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M5 4H3v1.5A3.5 3.5 0 0 0 6.5 9M19 4h2v1.5A3.5 3.5 0 0 1 17.5 9"/><line x1="12" y1="13" x2="12" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 10-13h-7l3-7z"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  heart:'<path d="M12 21s-7-4.6-9.3-9C1 8 3 4.5 6.5 4.5c2 0 3.5 1.5 5.5 3 2-1.5 3.5-3 5.5-3C21 4.5 23 8 21.3 12 19 16.4 12 21 12 21z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h.1a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'};
 return '<svg '+a+'>'+(p[n]||'')+'</svg>';}

var RANKS=["E","D","C","B","A","S"];
var RANK_COLORS=["#8a8f9c","#c08043","#cbd0db","#3d7eff","#9b5cff","#ffb02e"];
var TITLES=["Awakened","Striver","Challenger","Elite","Ace","Monarch"];
var STATS=[{name:"Strength",ic:"force",k:"力"},{name:"Power",ic:"puissance",k:"跳"},{name:"Endurance",ic:"endurance",k:"耐"},{name:"Control",ic:"controle",k:"制"}];
var AURA=[{k:"Violet",c:"#8b7bff",c2:"#6aa6ff"},{k:"Azure",c:"#3aa0ff",c2:"#5cc8ff"},{k:"Crimson",c:"#ff5566",c2:"#ff8a8a"},{k:"Emerald",c:"#2ad19e",c2:"#5ad1a6"},{k:"Gold",c:"#ffc24d",c2:"#ffd166"}];
var GOALS=[{k:"Lean & agile",avatar:"🥷"},{k:"Athletic & balanced",avatar:"🦸"},{k:"Massive & powerful",avatar:"💪"}];
var PRAISE=["Nice!","Keep going!","Strong!","Power up!","Hold on!","Superb!","Again!"];
var ONOM=["ドン!","バキ!","ズン!","ゴォ!"];
/* ---- gacha data ---- */
var GRADE_COL={E:"#8a8f9c",D:"#c08043",C:"#cbd0db",B:"#3d7eff",A:"#9b5cff",S:"#ffb02e",SS:"#ff4d6d",SSR:"#ff5cc8"};
var CARDS=[
 {n:"Nobushi",g:"E",e:"👹"},{n:"Yotaka",g:"E",e:"🌑"},{n:"Arakure",g:"E",e:"💢"},{n:"Ashigaru",g:"E",e:"🪖"},
 {n:"Kagemusha",g:"D",e:"🥷"},{n:"Kage-Shinobi",g:"D",e:"🌀"},{n:"Sekitori-Oni",g:"D",e:"🥊"},
 {n:"Kirisame",g:"C",e:"🌧️"},{n:"Doku-Kiri",g:"C",e:"☠️"},{n:"Hebigarami",g:"C",e:"🐍"},
 {n:"Zanketsu",g:"B",e:"⚔️"},{n:"Raiga-Ken",g:"B",e:"⚡"},{n:"Kabukimono",g:"B",e:"🎭"},
 {n:"Guren-Samurai",g:"A",e:"🔥"},{n:"Hyōga-Kenshi",g:"A",e:"❄️"},{n:"Kurojishi",g:"A",e:"🦁"},
 {n:"Tsujigiri",g:"S",e:"👹"},{n:"Aka-Oni Musha",g:"S",e:"👺"},{n:"Setsuna-Yasha",g:"S",e:"💀"},
 {n:"Ao-Oni Taishō",g:"SS",e:"🔱"},{n:"Mumyō",g:"SS",e:"🌌"},
 {n:"Raijin",g:"SSR",e:"⚡"},{n:"Yamata-Orochi",g:"SSR",e:"🐉"}
];
var BOSS=(function(){var i=0;for(var k=0;k<CARDS.length;k++){if(CARDS[k].n==="Tsujigiri"){i=k;break;}}return {n:CARDS[i].n,emo:CARDS[i].e,grade:CARDS[i].g,idx:i};})();
function isHolo(g){return ["A","S","SS","SSR"].indexOf(g)>=0;}
function rollGrade(){var r=Math.random()*100,t=[["B",46],["A",30],["S",14],["SS",7],["SSR",3]],acc=0;for(var k=0;k<t.length;k++){acc+=t[k][1];if(r<acc)return t[k][0];}return "SSR";}
function forceRareGrade(){var r=Math.random()*100;return r<55?"S":(r<85?"SS":"SSR");}
function pickCardOfGrade(g){var pool=[];for(var i=0;i<CARDS.length;i++)if(CARDS[i].g===g)pool.push(i);return pool.length?pool[Math.floor(Math.random()*pool.length)]:Math.floor(Math.random()*CARDS.length);}
function grantCard(idx){var was=D.cards[idx]||0;if(!was){D.cards[idx]=1;return{i:idx,dup:false,stars:1};}var maxed=was>=5;D.cards[idx]=Math.min(5,was+1);return{i:idx,dup:true,stars:D.cards[idx],maxed:maxed};}
function ownedCount(){var n=0;for(var k in D.cards){if(D.cards[k]>0)n++;}return n;}

/* ---------- state ---------- */
var D, view, actx=null, soundOn=true, _combo=0, timerInt=null, _reveal=null;
function freshDemo(){return {name:"", aura:0, goal:1, rank:0, level:1, xp:0, totalXP:0, tokens:0, streak:1, sessions:0,
  bossHP:100, quest:null, trial:null, step:0, cards:{}, freePacks:0, packOpened:false};}
function app(){return document.getElementById("app");}
function xpForLevel(l){return 100+(l-1)*30;}

/* ---------- sound / haptics ---------- */
function sfx(type,arg){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();var t=actx.currentTime;
  function tone(f,st,du,vol){var o=actx.createOscillator();var g=actx.createGain();o.type="sine";o.connect(g);g.connect(actx.destination);o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+st);g.gain.exponentialRampToValueAtTime(vol,t+st+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+st+du);o.start(t+st);o.stop(t+st+du+0.02);}
  if(type==="set"){tone(660,0,0.13,0.06);}
  else if(type==="level"){tone(523.25,0,0.22,0.05);tone(659.25,0.1,0.22,0.05);tone(783.99,0.2,0.3,0.05);}
  else if(type==="rank"){tone(523.25,0,0.2,0.06);tone(783.99,0.12,0.2,0.06);tone(1046.5,0.26,0.4,0.06);}
  else if(type==="cd"){var F=[523.25,659.25,783.99];tone(F[arg]||523.25,0,0.12,0.05);}
  else if(type==="go"){tone(880,0,0.18,0.06);}
  else if(type==="done"){tone(783.99,0,0.14,0.06);tone(1046.5,0.1,0.26,0.06);}
  else if(type==="hit"){tone(180,0,0.10,0.07);}
}catch(e){}}
function buzz(p){if(soundOn&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
function toggleSound(){soundOn=!soundOn;document.getElementById("muteBtn").innerHTML=soundOn?"&#128266;":"&#128263;";if(soundOn)sfx("set");}
function applyAura(a){document.documentElement.style.setProperty("--accent",a.c);document.documentElement.style.setProperty("--accent2",a.c2);}

/* ---------- FX ---------- */
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},1600);}
function fxShake(){var a=app();if(!a)return;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");setTimeout(function(){a.classList.remove("shake");},440);}
function fxSpeed(){var d=document.createElement("div");d.className="speedlines";document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove();},520);}
function levelUpFX(lvl){fxShake();fxSpeed();sfx("level");buzz([40,30,60]);var ov=document.createElement("div");ov.className="fx";
  ov.innerHTML='<div class="flash"></div><div class="rays"></div><div class="halftone"></div><div class="fxtxt"><div class="display" style="color:var(--accent2);font-size:30px;letter-spacing:2px">LEVEL UP</div><div class="display" style="font-size:88px;color:#fff;text-shadow:0 0 22px var(--accent)">Lv.'+lvl+'</div></div>';
  document.body.appendChild(ov);setTimeout(function(){ov.style.transition="opacity .4s";ov.style.opacity="0";},1250);setTimeout(function(){if(ov.parentNode)ov.remove();},1700);}
function floatXP(i,n){var el=document.getElementById("ex"+i);if(!el)return;var f=document.createElement("div");f.className="floaty";f.textContent="+"+n+" XP";f.style.right="14px";f.style.top="14px";el.appendChild(f);setTimeout(function(){f.remove();},1000);}
function popOnom(i){var el=document.getElementById("ex"+i);if(!el)return;var r=el.getBoundingClientRect();var f=document.createElement("div");f.className="onom";f.style.position="fixed";f.style.fontSize="46px";f.style.animationDuration="1.9s";f.style.left=(r.left+r.width*(0.12+Math.random()*0.35))+"px";f.style.top=(r.top+r.height*0.10)+"px";f.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];document.body.appendChild(f);fxShake();fxSpeed();setTimeout(function(){if(f.parentNode)f.remove();},1900);}
function comboPop(i,n){var el=document.getElementById("ex"+i);if(!el)return;var r=el.getBoundingClientRect();var d=document.createElement("div");d.className="combopop";d.style.fontSize=(20+Math.min(n,10))+"px";d.textContent="⚡ x"+n;d.style.left=(r.left+r.width*0.5-40)+"px";d.style.top=(r.top+8)+"px";document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove();},800);}

/* ---------- XP / levels ---------- */
function addXP(n){D.xp+=n;D.totalXP+=n;var up=false,lv=D.level;while(D.xp>=xpForLevel(D.level)){D.xp-=xpForLevel(D.level);D.level++;up=true;}
  if(up){setTimeout(function(){levelUpFX(D.level);},60);
    if(D.rank<RANKS.length-1 && D.level>=2 && !D.trialUnlocked){D.trialUnlocked=true;}}
  return up;}

/* ================= SCREEN ROUTER ================= */
function render(){var a=app();
  if(view==="splash")return renderSplash();
  if(view==="awaken")return renderAwaken();
  if(view==="scan")return renderScan();
  if(view==="assess")return renderAssess();
  if(view==="tut")return renderTut();
  if(view==="home")return renderHome();
  if(view==="session")return renderSession(false);
  if(view==="trial")return renderSession(true);
  if(view==="reward")return renderReward();
  if(view==="collection")return renderCollection();
  if(view==="end")return renderEnd();
}

/* ---------- 1. splash ---------- */
function renderSplash(){document.getElementById("demochip").style.display="";
  app().innerHTML='<div onclick="go(\'awaken\')" style="position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:100">'+
    '<div class="display" style="font-size:64px;color:#fff;text-shadow:0 0 26px var(--accent);animation:intrologo 1s ease both">RE<span style="color:var(--accent)">:</span>ARISE</div>'+
    '<div class="tag" style="margin-top:6px;letter-spacing:4px;background:var(--grad);color:#fff;border:none">CONVENTION DEMO</div>'+
    '<div class="tapwiggle" style="margin-top:40px;color:#fff;font-weight:800;letter-spacing:1px">Tap to awaken</div>'+
    '<div class="dim tiny" style="position:absolute;bottom:22px">A Solo-Leveling-style calisthenics quest · ~5 min</div></div>';}

/* ---------- 2. awakening ---------- */
function renderAwaken(){sfx("go");document.getElementById("demochip").style.display="";
  app().innerHTML='<div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh">'+
    '<div class="sysframe" style="text-align:center">'+
    '<div class="systag">「 SYSTEM 」<span class="syscur">▐</span></div>'+
    '<div class="bigico" style="color:var(--accent2)">'+icon("system",40)+'</div>'+
    '<h2 class="center">A dormant soul stirs.</h2>'+
    '<div class="narr">You have been chosen as a Player. The System will read your body, set your Rank, and give you quests. Clear them — and rise from E to S.</div>'+
    '<button class="btn" style="margin-top:18px" onclick="go(\'scan\')">Begin the Scan</button>'+
    '</div></div>';}

/* ---------- 3. scan (name / goal / aura / experience) ---------- */
var SCAN=[
 {key:"name",ic:"profile",q:"State your name",sub:"The System will record your Player name.",input:true},
 {key:"goal",ic:"puissance",q:"Choose your path",sub:"What body do you want to forge?",choices:GOALS.map(function(g){return g.k;})},
 {key:"aura",ic:"star",q:"Pick your aura",sub:"Your mana signature colours the System.",aura:true},
 {key:"exp",ic:"bolt",q:"Scan: your past",sub:"The System reads your history. Be honest.",choices:["Dormant","Irregular","Disciplined","Veteran"]}
];
function renderScan(){var st=D.step, Q=SCAN[st];
  var opts;
  if(Q.input){opts='<div style="margin-top:18px"><input id="nameIn" value="'+(D.name||"").replace(/"/g,"")+'" maxlength="14" placeholder="Your name" style="width:100%;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);color:var(--text);font-weight:700;font-size:16px;text-align:center"></div><button class="btn" style="margin-top:14px" onclick="scanName()">Continue</button>';}
  else if(Q.aura){opts='<div style="display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap">'+AURA.map(function(a,i){return '<div onclick="scanAura('+i+')" style="cursor:pointer;text-align:center"><div style="width:52px;height:52px;border-radius:50%;background:'+a.c+';box-shadow:0 0 18px '+a.c+';border:2px solid rgba(255,255,255,.25)"></div><div style="font-size:11px;margin-top:7px;font-weight:700">'+a.k+'</div></div>';}).join("")+'</div>';}
  else{opts='<div style="margin-top:18px">'+Q.choices.map(function(o,i){return '<button class="btn ghost" style="margin:8px 0" onclick="scanPick(\''+Q.key+'\','+i+')">'+o+'</button>';}).join("")+'</div>';}
  app().innerHTML='<div class="screen"><div class="sysframe"><div class="systag">「 SYSTEM 」<span class="syscur">▐</span></div>'+
    '<div class="eyebrow" style="opacity:.7;letter-spacing:2px">Scan '+(st+1)+' / '+SCAN.length+'</div>'+
    '<div class="progress" style="margin:10px 0 22px"><i style="width:'+((st+1)/SCAN.length*100)+'%"></i></div>'+
    '<div class="bigico">'+icon(Q.ic,38)+'</div><h2 class="center">'+Q.q+'</h2><p class="sysnar">'+Q.sub+'</p>'+opts+
    (st>0?'<button class="btn ghost sm" style="margin-top:6px" onclick="D.step--;render()">Back</button>':'')+'</div></div>';}
function scanName(){var v=document.getElementById("nameIn");D.name=(v&&v.value.trim())||"Player";sfx("set");D.step++;render();}
function scanAura(i){D.aura=i;applyAura(AURA[i]);sfx("set");D.step++;render();}
function scanPick(key,i){D[key]=i;sfx("set");if(D.step>=SCAN.length-1){finishScan();}else{D.step++;render();}}

/* ---------- 4. assessment ---------- */
function finishScan(){D.rank=0;applyAura(AURA[D.aura]);var fl=document.createElement("div");fl.className="awflash";document.body.appendChild(fl);setTimeout(function(){fl.remove();},1100);sfx("rank");buzz([40,30,60]);view="assess";render();}
function renderAssess(){app().innerHTML='<div class="modal"><div class="modalbox"><div class="eyebrow">Assessment complete</div>'+
  '<div class="rankbadge" style="margin:18px auto;width:84px;height:84px;font-size:42px;background:'+RANK_COLORS[D.rank]+'">'+RANKS[D.rank]+'</div>'+
  '<h2>Player Rank '+RANKS[D.rank]+'</h2><p class="muted small">Your starting point, '+D.name+'. Now climb.</p>'+
  '<div class="narr">Four stats define you — Strength, Power, Endurance, Control. Raise them, and your Rank rises with you.</div>'+
  '<button class="btn" style="margin-top:18px" onclick="go(\'tut\')">Enter</button></div></div>';}

/* ---------- 5. tiny tutorial ---------- */
var tutStep=0;
var TUT=["Welcome, Player. Each day you clear a Daily Quest of exercises to earn XP and grow stronger.",
 "Every set damages the day's boss. Beat it to earn a card pack — collect hunters from E all the way to legendary SSR.",
 "Hit a level milestone to face a Rank-Up Trial — clear it to climb E → D → C → B → A → S."];
function renderTut(){TUT[0]="Welcome, "+D.name+". Each day you clear a Daily Quest of exercises to earn XP and grow stronger.";
  var last=tutStep>=TUT.length-1;
  app().innerHTML='<div class="modal"><div class="modalbox syswin" style="border-color:var(--accent2);box-shadow:0 0 30px rgba(255,138,61,.25)"><div class="syshdr">「SYSTEM」</div>'+
   '<div class="bigico" style="color:var(--accent2)">'+icon("bolt",36)+'</div>'+
   '<p style="font-size:15px;line-height:1.55;margin:6px 4px 0">'+TUT[tutStep]+'</p>'+
   '<div class="dim tiny" style="margin-top:12px">'+(tutStep+1)+' / '+TUT.length+'</div>'+
   '<button class="btn" style="margin-top:14px" onclick="'+(last?'startQuest()':'tutStep++;render()')+'">'+(last?'Start my first quest':'Next')+'</button></div></div>';}

/* ---------- 6. daily quest / session ---------- */
function makeQuest(){return [
  {name:"Jumping Jacks", ic:"puissance", fam:"cardio", type:"time", target:15, sets:1, xp:20, rank:"E"},
  {name:"Push-ups",      ic:"force",     fam:"pousser", type:"reps", target:5,  sets:2, xp:28, rank:"E"},
  {name:"Squats",        ic:"puissance", fam:"jambes",  type:"reps", target:8,  sets:2, xp:26, rank:"E"},
  {name:"Plank",         ic:"endurance", fam:"gainage", type:"time", target:20, sets:1, xp:30, rank:"E"}
].map(function(e){e.doneSets=0;e.done=false;return e;});}
function makeTrial(){return [
  {name:"Diamond Push-ups", ic:"force", fam:"pousser", type:"reps", target:6, sets:1, xp:50, rank:"D"}
].map(function(e){e.doneSets=0;e.done=false;return e;});}

function startQuest(){D.quest=makeQuest();_combo=0;go("session");}
function curList(isTrial){return isTrial?D.trial:D.quest;}
function totalSets(list){return list.reduce(function(a,e){return a+e.sets;},0);}

function bossPanel(){return '<div class="bosswrap" id="bosspanel"><div class="row between" style="align-items:center">'+
  '<div class="row" style="gap:10px"><span class="bossface">'+BOSS.emo+'</span><div><div class="eyebrow" style="color:#ff8a8a">Daily Boss</div><b style="font-size:15px">'+BOSS.n+'</b></div></div>'+
  '<div class="row" style="gap:8px;align-items:center"><span class="combotag" id="combotag"'+(_combo>=2?'':' style="display:none"')+'>'+(_combo>=2?'⚡ x'+_combo:'')+'</span><span class="hpnum" id="hpnum">'+Math.round(D.bossHP)+'%</span></div></div>'+
  '<div class="hpbar"><i id="hpfill" style="width:'+D.bossHP+'%"></i></div></div>';}
function updateBoss(i){var bp=document.getElementById("bosspanel");if(bp){bp.classList.remove("bosshit");void bp.offsetWidth;bp.classList.add("bosshit");
  var z=document.createElement("div");z.className="bosszap";bp.appendChild(z);setTimeout(function(){z.remove();},340);
  var r=bp.getBoundingClientRect();var d=document.createElement("div");d.className="dmgfloat";var dmg=Math.round(100/totalSets(D.quest));d.textContent="-"+dmg;d.style.left=(r.left+r.width*0.5+20)+"px";d.style.top=(r.top+r.height*0.4)+"px";document.body.appendChild(d);setTimeout(function(){d.remove();},900);}
  sfx("hit");
  var f=document.getElementById("hpfill");if(f)f.style.width=D.bossHP+"%";var n=document.getElementById("hpnum");if(n)n.textContent=Math.round(D.bossHP)+"%";}

function renderSession(isTrial){var q=curList(isTrial);var dn=q.filter(function(e){return e.done;}).length;
  app().innerHTML='<div class="screen"><div class="row between"><button class="setbtn" style="flex:0;min-width:44px;color:var(--muted)" onclick="go(\'home\')">'+icon("back",18)+'</button>'+
   '<div class="eyebrow"'+(isTrial?' style="color:var(--xp)"':'')+'>'+(isTrial?"Rank-Up Trial":"Daily Quest")+'</div><span class="muted small">'+dn+'/'+q.length+'</span></div>'+
   '<div class="progress" style="margin:12px 0 14px"><i style="width:'+(dn/q.length*100)+'%"></i></div>'+
   (!isTrial?bossPanel():'<div class="narr" style="margin-bottom:12px">A harder trial. Clear it to seize Rank '+RANKS[D.rank+1]+' and finish the boss.</div>')+
   q.map(function(e,i){return exCard(e,i,isTrial);}).join("")+
   (q.every(function(e){return e.done;})?'<button class="btn '+(isTrial?'gold':'ok')+'" style="margin-top:8px" onclick="'+(isTrial?'finishTrial()':'finishSession()')+'">'+(isTrial?"Claim Rank "+RANKS[D.rank+1]:"Complete session")+'</button>':'<p class="dim small center" style="margin-top:6px">Complete all sets to finish.</p>')+
  '</div>';}
function exCard(e,i,isTrial){var sets;
  if(e.done){sets='<div class="small" style="color:var(--ok);margin-top:12px;font-weight:700">Done · +'+(e.xp*e.sets)+' XP</div>';}
  else{var next=e.doneSets;var pips='';for(var s=0;s<e.sets;s++){pips+='<span class="pip '+(s<e.doneSets?"on":"")+'"></span>';}
    var act=e.type==="time"?("startTimer("+i+","+next+","+(isTrial?"true":"false")+")"):("validSet("+i+","+(isTrial?"true":"false")+")");
    var lab=(e.type==="time")?"Start "+e.target+"s":"Log set";
    sets='<div class="setrow">'+(e.sets>1?'<div class="pips">'+pips+'</div>':'')+'<div class="setbtns"><button class="btn ghost sm setone" onclick="'+act+'">'+lab+'</button><button class="btn ghost sm setmini" onclick="skipSet('+i+','+(isTrial?"true":"false")+')">Skip</button></div></div>';}
  return '<div class="ex '+(e.done?"done":"")+'" id="ex'+i+'">'+
   '<div class="row"><span class="ico">'+icon(e.ic,20)+'</span><div><b>'+e.name+'</b> <span class="tag" style="margin-left:4px">'+e.rank+'</span>'+
   '<div style="font-weight:800;font-size:18px;margin-top:5px">'+(e.type==="time"?(e.sets+' × '+e.target+'s'):(e.sets+' × '+e.target+' reps'))+'</div>'+
   '<div class="dim tiny" style="margin-top:2px">+'+e.xp+' XP/set</div></div></div>'+sets+'</div>';}

function refreshEx(i,isTrial){var q=curList(isTrial);if(q[i].done){renderSession(isTrial);return;}var el=document.getElementById("ex"+i);if(el)el.outerHTML=exCard(q[i],i,isTrial);
  var pb=document.querySelector(".progress>i");if(pb)pb.style.width=(q.filter(function(e){return e.done;}).length/q.length*100)+"%";}

function validSet(i,isTrial){var e=curList(isTrial)[i];if(e.doneSets>=e.sets)return;e.doneSets++;addXP(e.xp);floatXP(i,e.xp);sfx("set");buzz(15);
  if(!isTrial){D.bossHP=Math.max(0,D.bossHP-Math.round(100/totalSets(D.quest)));D.tokens+=5;_combo++;
    if(_combo>=2)comboPop(i,_combo);
    var ct=document.getElementById("combotag");if(ct&&_combo>=2){ct.style.display="";ct.textContent="⚡ x"+_combo;}
    if(_combo%3===0){addXP(10);floatXP(i,10);}}
  if(e.doneSets>=e.sets){e.done=true;popOnom(i);}
  if(!isTrial)updateBoss(i);
  refreshEx(i,isTrial);}
function skipSet(i,isTrial){var e=curList(isTrial)[i];if(e.doneSets>=e.sets)return;e.doneSets++;e.skipped=true;_combo=0;var ct=document.getElementById("combotag");if(ct)ct.style.display="none";
  if(!isTrial)D.bossHP=Math.max(0,D.bossHP-Math.round(100/totalSets(D.quest)));
  if(e.doneSets>=e.sets){e.done=true;popOnom(i);}
  if(!isTrial)updateBoss(i);refreshEx(i,isTrial);}

/* timer with 3-2-1 then countdown */
function startTimer(i,s,isTrial){var e=curList(isTrial)[i];var ov=document.createElement("div");ov.className="modal";ov.id="tmodal";
  ov.innerHTML='<div class="modalbox"><div class="eyebrow">'+e.name+' — Set '+(s+1)+'</div><div class="dim small" id="tphase" style="margin-top:6px">Get ready</div><div class="timer" id="tval" style="margin:10px 0 18px">3</div><button class="btn ghost sm" onclick="skipTimer('+i+','+(isTrial?"true":"false")+')">Skip</button></div>';
  document.body.appendChild(ov);sfx("cd",0);var prep=3;clearInterval(timerInt);
  timerInt=setInterval(function(){prep--;var v=document.getElementById("tval");if(prep>0){if(v)v.textContent=prep;sfx("cd",3-prep);}else{clearInterval(timerInt);startTimerReal(i,s,isTrial);}},1000);}
function startTimerReal(i,s,isTrial){var e=curList(isTrial)[i];var left=e.target;var ph=document.getElementById("tphase");if(ph)ph.textContent="Hold!";var v=document.getElementById("tval");if(v)v.textContent=left;buzz(30);sfx("go");clearInterval(timerInt);
  timerInt=setInterval(function(){left--;var vv=document.getElementById("tval");if(vv)vv.textContent=left;if(left>0&&left<=3)sfx("cd",3-left);if(left<=0){clearInterval(timerInt);sfx("done");if(vv)vv.innerHTML=icon("trophy",46);setTimeout(function(){stopTimer();validSet(i,isTrial);},450);}},1000);}
function stopTimer(){clearInterval(timerInt);var m=document.getElementById("tmodal");if(m)m.remove();}
function skipTimer(i,isTrial){clearInterval(timerInt);var m=document.getElementById("tmodal");if(m)m.remove();validSet(i,isTrial);}

/* ---------- session complete ---------- */
function finishSession(){_combo=0;var mult=1+Math.min(0.5,D.streak*0.05),bonus=Math.round(40*mult);addXP(bonus);D.sessions++;
  var trialReady=(D.rank<RANKS.length-1);
  app().innerHTML='<div class="modal"><div class="modalbox"><div class="bigico" style="color:var(--ok)">'+icon("trophy",46)+'</div>'+
    '<div class="eyebrow" style="color:var(--ok)">Session complete</div><h2>'+BOSS.n+'</h2><div class="dim small" style="margin-top:2px">'+Math.round(D.bossHP)+'% HP left</div>'+
    '<p class="muted small" style="margin-top:8px">Completion bonus · multiplier ×'+mult.toFixed(2)+'</p>'+
    '<div class="num" style="color:var(--xp);margin:12px 0">+'+bonus+' XP</div>'+
    '<div class="pill" style="margin:0 auto;color:var(--accent2)">'+icon("flame",14)+' '+D.streak+' day streak</div>'+
    (trialReady?'<p class="small" style="margin-top:14px;color:var(--xp);font-weight:800">Rank-Up Trial unlocked!</p>':'')+
    '<button class="btn" style="margin-top:14px" onclick="startTrial()">'+(trialReady?'Face the Rank-Up Trial':'Continue')+'</button></div></div>';}

/* ---------- rank-up trial ---------- */
function startTrial(){D.trial=makeTrial();_combo=0;go("trial");}
function finishTrial(){_combo=0;D.rank=Math.min(RANKS.length-1,D.rank+1);D.trial=null;D.sessions++;D.streak++;addXP(0);D.bossHP=0;
  fxShake();fxSpeed();sfx("rank");buzz([40,30,80]);var r=D.rank;
  app().innerHTML='<div class="modal"><div class="modalbox" style="position:relative;overflow:hidden"><div class="flash" style="background:radial-gradient(circle at 50% 40%,rgba(255,209,102,.45),transparent 65%)"></div><div class="rays gold"></div><div class="halftone"></div>'+
    '<div class="bigico" style="position:relative;color:var(--xp)">'+icon("star",46)+'</div><div class="eyebrow" style="position:relative;color:var(--xp)">Rank-Up Trial passed</div>'+
    '<h2 class="display" style="margin-top:6px;font-size:48px">RANK UP</h2>'+
    '<div class="rankbadge" style="margin:14px auto;width:76px;height:76px;font-size:36px;background:'+RANK_COLORS[r]+'">'+RANKS[r]+'</div>'+
    '<p class="muted small">You are now Rank '+RANKS[r]+'.</p><div class="narr">A new threshold is crossed — the Player rises.</div>'+
    '<div style="color:var(--accent2);font-weight:800;margin-top:6px">New title: '+TITLES[r]+'</div>'+
    '<button class="btn gold" style="margin-top:16px" onclick="bossDefeated()">Continue</button></div></div>';}

/* ---------- boss defeated → grant card + pack ---------- */
function bossDefeated(){grantCard(BOSS.idx);D.freePacks=1;D.tokens+=100;sfx("done");fxShake();var holo=isHolo(BOSS.grade);
  app().innerHTML='<div class="modal"><div class="modalbox" style="position:relative;overflow:hidden"><div class="flash"></div><div class="halftone"></div>'+
    '<div class="eyebrow" style="color:#ff8a8a;position:relative">Boss defeated</div>'+
    '<div class="cardrev '+(holo?'holo':'')+'"><span class="cgrade" style="color:'+GRADE_COL[BOSS.grade]+'">'+BOSS.grade+'</span>'+BOSS.emo+'<span class="cname">'+BOSS.n+'</span></div>'+
    '<b style="position:relative">'+BOSS.n+' · '+BOSS.grade+' added to your Bestiary</b>'+
    '<div class="dim tiny" style="margin-top:4px;color:var(--ok)">+100 '+icon("bolt",11)+' shards · +1 card pack</div>'+
    '<button class="btn gold" style="margin-top:16px" onclick="go(\'reward\')">Open your reward</button></div></div>';}

/* ---------- reward: open a card pack (gacha) ---------- */
function renderReward(){document.getElementById("demochip").style.display="";
  app().innerHTML='<div class="screen center">'+
   '<div class="eyebrow" style="color:var(--xp);margin-top:12px">Reward</div>'+
   '<h2 style="margin-top:6px">Victory Pack</h2>'+
   '<p class="muted small" style="margin-top:6px;max-width:320px;margin-left:auto;margin-right:auto">Every boss drops a card pack. Each pack holds 3 hunters — chase the holo A, S and legendary SSR pulls.</p>'+
   '<div class="row" style="justify-content:center;gap:8px;margin-top:12px">'+
     ["E","D","C","B","A","S","SS","SSR"].map(function(g){return '<span class="tag" style="color:'+GRADE_COL[g]+';border-color:'+GRADE_COL[g]+'">'+g+'</span>';}).join("")+'</div>'+
   '<div class="pill" style="margin:14px auto 0;color:#7fdcff">'+icon("bolt",14)+' '+D.tokens+' shards</div>'+
   '<div class="packbtn" onclick="openPack()"><div class="pkstar"></div><div class="pkshine"></div><div class="pkgem">◆</div><div class="pk">?</div><div class="pklabel">CARD PACK</div></div>'+
   '<div class="tapwiggle" style="margin-top:16px;font-weight:800;letter-spacing:.5px">Tap the pack to open</div>'+
   '</div>';}

function openPack(){if(D.packOpened)return;D.packOpened=true;D.freePacks=Math.max(0,D.freePacks-1);
  var grades=[rollGrade(),rollGrade(),forceRareGrade()];
  var res=grades.map(function(g){return grantCard(pickCardOfGrade(g));});
  packReveal(res);}

function packReveal(list){var order=["E","D","C","B","A","S","SS","SSR"];
  list=list.slice().sort(function(a,b){return order.indexOf(CARDS[a.i].g)-order.indexOf(CARDS[b.i].g);});
  _reveal={list:list,idx:0};
  var ov=document.createElement("div");ov.className="modal";ov.id="packov";
  ov.innerHTML='<div class="modalbox" style="max-width:340px;text-align:center;position:relative;overflow:hidden"><div class="halftone"></div><div class="eyebrow" style="color:var(--xp);position:relative">Opening pack</div><div id="revstage" style="margin-top:12px;position:relative"></div></div>';
  document.body.appendChild(ov);sfx("go");showReveal();}

function cardHTML(idx,starsOverride){var c=CARDS[idx],g=c.g,col=GRADE_COL[g],st=(starsOverride!=null?starsOverride:(D.cards[idx]||0)),owned=st>0,holo=isHolo(g);
  var art='<div class="gcardart" style="'+(owned?'':'filter:grayscale(1) brightness(.5)')+'">'+c.e+
    (owned&&holo?'<div class="cardholo"></div><div class="cardshine"></div>':'')+(owned?'':'<div class="lock">🔒</div>')+
    '<div class="gcardgem" style="border-color:'+col+'"><span style="background:'+col+'"></span><b style="color:'+col+'">'+g+'</b></div></div>';
  var stars=owned?('<div class="gstars" style="color:'+col+'">'+"★".repeat(st)+"☆".repeat(5-st)+'</div>'):'';
  return '<div class="gcard" style="border-color:'+col+';box-shadow:'+(owned?('0 0 14px '+col+'aa'):'none')+'">'+art+
   '<div class="gcardname"><div class="gn" style="color:'+(owned?'#fff':'var(--dim)')+'">'+(owned?c.n:'???')+'</div>'+stars+'</div></div>';}

function showReveal(){var st=_reveal;if(!st)return;var r=st.list[st.idx],c=CARDS[r.i],g=c.g,col=GRADE_COL[g],rare=isHolo(g);
  var stage=document.getElementById("revstage");if(!stage)return;
  var rays=rare?'<div class="revrays" style="background:radial-gradient(circle,'+col+',transparent 62%)"></div>':'';
  stage.innerHTML='<div class="dim tiny" style="margin-bottom:10px">'+(st.idx+1)+' / '+st.list.length+'</div>'+
   '<div class="flipwrap" onclick="flipReveal()">'+rays+
     '<div class="flipcard" id="flipcard">'+
       '<div class="flipface flipback" style="box-shadow:0 0 30px '+col+'cc;border-color:'+col+'">✦</div>'+
       '<div class="flipface flipfront"><div class="revtag">'+(r.dup?(r.maxed?"MAX":"+1★"):"NEW")+'</div>'+cardHTML(r.i,r.stars)+'</div>'+
     '</div></div>'+
   '<div class="revhint" id="revhint">Tap the card to reveal</div><div id="revbtn"></div>';}

function flipReveal(){var c=document.getElementById("flipcard");if(!c||c.classList.contains("flipped"))return;c.classList.add("flipped");
  var st=_reveal,g=CARDS[st.list[st.idx].i].g,rare=isHolo(g);buzz(rare?[30,20,40]:15);sfx(rare?"rank":"set");if(rare){fxSpeed();}
  var h=document.getElementById("revhint");if(h)h.style.display="none";
  var last=st.idx>=st.list.length-1;var b=document.getElementById("revbtn");
  if(b){b.style.marginTop="14px";b.innerHTML='<button class="btn'+(rare?' gold':'')+'" onclick="'+(last?'endReveal()':'nextReveal()')+'">'+(last?'Continue':'Next')+'</button>'+(last?'':'<button class="btn ghost sm" style="margin-top:8px" onclick="skipReveal()">Reveal all</button>');}}

function nextReveal(){if(!_reveal)return;_reveal.idx++;if(_reveal.idx>=_reveal.list.length){endReveal();return;}showReveal();}
function skipReveal(){if(!_reveal)return;var cells=_reveal.list.map(function(r){return '<div style="position:relative">'+cardHTML(r.i,r.stars)+'<div class="revtag">'+(r.dup?(r.maxed?"MAX":"+1★"):"NEW")+'</div></div>';}).join("");
  var stage=document.getElementById("revstage");if(stage)stage.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+cells+'</div><button class="btn" style="margin-top:14px" onclick="endReveal()">Continue</button>';}
function endReveal(){_reveal=null;var m=document.getElementById("packov");if(m)m.remove();view="collection";render();}

/* ---------- collection / bestiary ---------- */
function renderCollection(){document.getElementById("demochip").style.display="";
  var cells=CARDS.map(function(c,i){return cardHTML(i);}).join("");
  app().innerHTML='<div class="screen">'+
   '<div class="eyebrow" style="margin-top:28px">Collection</div>'+
   '<div class="row between" style="align-items:center;margin-top:2px"><h2>Bestiary</h2><span class="pill" style="color:var(--accent2)">'+ownedCount()+' / '+CARDS.length+'</span></div>'+
   '<p class="dim tiny" style="margin-top:6px">The hunters you have collected. Duplicates raise a card’s ★ level.</p>'+
   '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">'+cells+'</div>'+
   '<button class="btn gold" style="margin-top:18px" onclick="go(\'end\')">Finish demo</button>'+
   '</div>';}

/* ---------- end / recap ---------- */
function renderEnd(){document.getElementById("demochip").style.display="";
  var rows=[["Rank",RANKS[D.rank]],["Level",D.level],["Total XP",D.totalXP],["Cards",ownedCount()+"/"+CARDS.length],["Shards",D.tokens],["Streak",D.streak+"d"]];
  app().innerHTML='<div class="screen"><div class="sysframe" style="text-align:center">'+
   '<div class="systag">「 SYSTEM 」</div>'+
   '<div class="bigico" style="color:var(--xp)">'+icon("trophy",46)+'</div>'+
   '<div class="eyebrow" style="color:var(--xp)">Demo complete</div>'+
   '<h2 style="margin-top:6px">'+D.name+' · '+TITLES[D.rank]+'</h2>'+
   '<div class="narr">In minutes you awakened, cleared a quest, felled a boss and rose to Rank '+RANKS[D.rank]+'. The full RE:ARISE is a 90-day journey — E all the way to S.</div>'+
   '<div class="grid2" style="margin-top:14px">'+rows.map(function(r){return '<div class="stat"><div class="lab">'+r[0]+'</div><div class="rk" style="margin-top:6px;font-size:20px">'+r[1]+'</div></div>';}).join('')+'</div>'+
   '<button class="btn" style="margin-top:16px" onclick="go(\'collection\')">'+icon("trophy",16)+' View my card collection</button>'+
   '<a class="btn gold" style="margin-top:10px;text-decoration:none" href="https://nonoskillers.github.io/re-arise/" target="_blank" rel="noopener">Get the full app</a>'+
   '<button class="btn ghost" style="margin-top:10px" onclick="restartDemo()">Play again (next visitor)</button>'+
   '<div class="dim tiny" style="margin-top:14px;opacity:.6">RE:ARISE · convention demo build</div>'+
   '</div></div>';}

/* ---------- nav helpers ---------- */
function go(v){view=v;render();}
function restartDemo(){clearInterval(timerInt);var ms=document.querySelectorAll(".modal,.fx,.speedlines,.awflash,.toast");ms.forEach(function(m){m.remove();});
  D=freshDemo();tutStep=0;_combo=0;applyAura(AURA[0]);view="splash";render();}

/* ---------- boot ---------- */
D=freshDemo();applyAura(AURA[0]);view="splash";render();
</script>
</body>
</html>
